# Test, build and check the bundle on a GitHub macOS runner.
#
# GitHub's macOS images have a logged-in session and a WindowServer, so the
# window tests run (the skip count says if that ever changes), and Vision runs
# on the runner's own Mac.  im and asdf-macos-app come from checkouts beside
# this one, as the Makefile expects; IM's libraries from the lispnik/tecgraf tap.
#
# The live tests -- Apple's geocoder, Finder -- are
# skipped here: each needs a variable set (tests/package.lisp, LIVE-P).
#
# Publishing a release on GitHub runs all this too, and then puts a disk
# image of the bundle that passed on the release.  For a release, with these
# repository secrets set, the bundle is signed with a Developer ID, and it
# and the disk image are notarised and stapled, so they open on any Mac
# without a warning:
#
#   MACOS_CERTIFICATE_P12       the Developer ID Application certificate and
#                               its key, exported as .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   MACOS_SIGNING_IDENTITY      its name, as `security find-identity` prints it
#   NOTARY_KEY_P8               an App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID               its key ID
#   NOTARY_ISSUER               its issuer ID
#
# tools/set-github-secrets.sh checks and sets them -- the same six as
# ftp-server-app's, so one set of files does for both.
# Without them -- and on every push -- the bundle is signed ad hoc.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGNED_RELEASE: ${{ github.event_name == 'release' && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL and IM
        run: |
          brew install sbcl
          brew tap lispnik/tecgraf
          brew install lispnik/tecgraf/tecgraf-im

      - name: Check out im and asdf-macos-app beside this one
        run: |
          git clone --depth 1 https://github.com/lispnik/im.git ../im
          git clone --depth 1 https://github.com/lispnik/asdf-macos-app.git ../asdf-macos-app

      - name: Install ocicl
        run: |
          # As objc's CI does: a watchdog and three attempts, because one run
          # sat in this step for the whole job budget.
          attempt_with_timeout() {
            local secs=$1; shift
            ( "$@" ) & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local watchdog=$!
            local rc=0; wait "$pid" || rc=$?
            kill -9 "$watchdog" 2>/dev/null || true
            return $rc
          }
          install_ocicl() {
            rm -rf "$HOME/ocicl-src"
            git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src" &&
              ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          }
          for attempt in 1 2 3; do
            attempt_with_timeout 600 install_ocicl && break
            [ "$attempt" = 3 ] && { echo "::error::ocicl could not be installed"; exit 1; }
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          ocicl setup
          # ocicl exits 0 when a download fails; look for it.
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            grep -q "failed to install" ocicl-install.log || break
            sleep 30
          done
          ! grep -q "failed to install" ocicl-install.log

      - name: Test
        run: make test

      - name: Load the Developer ID
        if: env.SIGNED_RELEASE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -qF "\"$IDENTITY\"" ||
            { echo "::error::MACOS_CERTIFICATE_P12 does not hold \"$IDENTITY\""; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # The API key as the keychain profile make notarize names.
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Build the bundle
        run: make app

      - name: Notarise the bundle
        if: env.SIGNED_RELEASE == 'true'
        run: make notarize

      - name: Run the bundle on the account pictures
        run: |
          make samples
          open -W --env IMAGE_DESCRIBE_SELFTEST="$PWD/build/Sample Pictures" "build/Image Describer.app"
          cat ~/Library/Logs/"Image Describer.log"
          grep -q "done: " ~/Library/Logs/"Image Describer.log"
          # And from a terminal, as a script would.
          IMAGE_DESCRIBER_APP="$PWD/build/Image Describer.app" \
            tools/image-describe --json "build/Sample Pictures/Animals/Zebra.heic" | tee zebra.json
          grep -q '"description":"Zebra' zebra.json

      - name: Keep the bundle
        run: cd build && ditto -c -k --keepParent "Image Describer.app" "Image Describer.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Image Describer (${{ env.SIGNED_RELEASE == 'true' && 'notarised' || 'ad hoc signed' }})
          path: build/Image Describer.zip

      - name: Make the disk image
        if: github.event_name == 'release'
        run: |
          make dmg DMG="build/Image-Describer-${GITHUB_REF_NAME}.dmg"
          hdiutil verify "build/Image-Describer-${GITHUB_REF_NAME}.dmg"

      - name: Notarise the disk image
        if: env.SIGNED_RELEASE == 'true'
        run: make notarize-dmg DMG="build/Image-Describer-${GITHUB_REF_NAME}.dmg"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: disk image
          path: build/Image-Describer-${{ github.ref_name }}.dmg

  # On a release: the disk image of the bundle the build job tested, on it.
  # A job of its own, so that only this one may write to the repository.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: disk image

      - name: Put it on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "Image-Describer-${GITHUB_REF_NAME}.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"
